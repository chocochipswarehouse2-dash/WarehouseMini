<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Warehouse Mini</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="description" content="Aplikasi Android & Web Scanner Gudang Pintar dengan sinkronisasi Supabase real-time, cetak barcode produk thermal 50x20mm massal Excel, multi-mode scan, modul Peminjaman Sementara (SPS) Live Studio/Shopee/TikTok, dan dark mode" />
    <meta property="og:title" content="Warehouse Mini" />
    <meta property="og:description" content="Aplikasi Android & Web Scanner Gudang Pintar dengan sinkronisasi Supabase real-time, cetak barcode produk thermal 50x20mm massal Excel, multi-mode scan, modul Peminjaman Sementara (SPS) Live Studio/Shopee/TikTok, dan dark mode" />
    
    <!-- PWA Meta Tags & Browser Orientation Hints -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Warehouse Mini" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Ensure Fullscreen Mode Scrolls Smoothly & Never Rotates DOM via CSS -->
    <style>
      html,
      body {
        transform: none !important;
      }
      html:fullscreen,
      html:-webkit-full-screen {
        width: 100% !important;
        height: 100% !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        background-color: var(--bg-app, #f4f6f8);
      }
      html.dark:fullscreen,
      html.dark:-webkit-full-screen {
        background-color: #0f172a;
      }
      html:fullscreen body,
      html:-webkit-full-screen body {
        width: 100% !important;
        min-height: 100% !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }
    </style>
    
    <!-- Instant Dark/Light Theme Sync on Load -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('wms_dark_mode');
          var isDark = saved === 'true';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
          var savedFont = localStorage.getItem('wms_theme_font');
          if (savedFont) {
            document.documentElement.classList.add('font-' + savedFont);
            document.documentElement.setAttribute('data-theme-font', savedFont);
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- GitHub Pages SPA Redirect Support -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    
    <!-- Native OS Portrait Lock for Mobile Browsers (Including Samsung Internet Fullscreen Lock) -->
    <script>
      (function() {
        // Clean up any legacy CSS classes from previous builds
        try {
          document.documentElement.classList.remove('wms-force-portrait-landscape');
          document.documentElement.style.removeProperty('--wms-portrait-w');
          document.documentElement.style.removeProperty('--wms-portrait-h');
          document.documentElement.style.removeProperty('--wms-portrait-transform');
          document.documentElement.style.removeProperty('transform');
        } catch (e) {}

        var needsFullscreenForOrientationLock = false;

        function isPhoneDevice() {
          var ua = navigator.userAgent || '';
          var isPhoneUA = /Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua) && !/iPad|Tablet/i.test(ua);
          var shortest = window.screen ? Math.min(window.screen.width || 9999, window.screen.height || 9999) : 9999;
          var innerShortest = Math.min(window.innerWidth || 9999, window.innerHeight || 9999);
          return (isPhoneUA || shortest < 600) && innerShortest < 600;
        }

        function isEditableTarget(el) {
          if (!el || typeof el.closest !== 'function') return false;
          return Boolean(
            el.closest('input, textarea, select, [contenteditable="true"], [contenteditable=""], label')
          );
        }

        function lockPortraitDirect() {
          try {
            if (!isPhoneDevice()) return Promise.resolve(false);
            var ori = window.screen && (window.screen.orientation || window.screen.mozOrientation || window.screen.msOrientation);
            if (ori && typeof ori.lock === 'function') {
              return ori.lock('portrait-primary').then(function() {
                needsFullscreenForOrientationLock = false;
                return true;
              }).catch(function() {
                return ori.lock('portrait').then(function() {
                  needsFullscreenForOrientationLock = false;
                  return true;
                }).catch(function() {
                  needsFullscreenForOrientationLock = true;
                  return false;
                });
              });
            }
          } catch (e) {
            needsFullscreenForOrientationLock = true;
          }
          return Promise.resolve(false);
        }

        function handleUserGestureLock(ev) {
          try {
            if (!isPhoneDevice()) return;
            if (ev && isEditableTarget(ev.target)) return;

            var docEl = document.documentElement;
            var isFullscreen = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
            var isLandscapeNow = window.innerWidth > window.innerHeight;
            var isSamsungBrowser = /SamsungBrowser/i.test(navigator.userAgent || '');

            // On Samsung Internet (or when direct lock rejected / screen is in landscape),
            // ScreenOrientation.lock() requires Fullscreen API to lock the Android Activity to Portrait.
            if (!isFullscreen && (needsFullscreenForOrientationLock || isSamsungBrowser || isLandscapeNow)) {
              var reqFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
              if (typeof reqFs === 'function') {
                var fsPromise = reqFs.call(docEl, { navigationUI: 'hide' });
                if (fsPromise && typeof fsPromise.then === 'function') {
                  fsPromise.then(function() {
                    lockPortraitDirect();
                  }).catch(function() {
                    lockPortraitDirect();
                  });
                  return;
                }
              }
            }

            lockPortraitDirect();
          } catch (e) {}
        }

        lockPortraitDirect();
        window.addEventListener('orientationchange', function() {
          lockPortraitDirect();
        }, { passive: true });
        window.addEventListener('touchend', handleUserGestureLock, { passive: true });
        window.addEventListener('pointerup', handleUserGestureLock, { passive: true });
        window.addEventListener('click', handleUserGestureLock, { passive: true });
      })();
    </script>

    <!-- Google Font & Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/samsungone" rel="stylesheet">
    <!-- Auto-Check Service Worker Updates on Page Load -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].update();
          }
        });
      }
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-500 selection:text-white min-h-screen text-[15px] sm:text-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
